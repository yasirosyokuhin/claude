<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>北海道つりゲーム</title>
<style>
  :root {
    --sea: #cfe8f2;
    --land: #dfe9d8;
    --land-line: #8fae86;
    --river-color: #2e7ab8;
    --dam-color: #b8622e;
    --bg: #f4f8f6;
    --card-bg: #ffffff;
    --ink: #1f2d2a;
    --sub-ink: #5a6d68;
    --accent: #1c7f79;
    --accent-dark: #135b56;
    --danger: #b3492f;
    --common: #8b98a0;
    --uncommon: #3f9d63;
    --rare: #3b74c4;
    --legend: #c99a2e;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    overflow-x: hidden;
    width: 100%;
  }
  body {
    display: flex;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
  }
  #app {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow-x: hidden;
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .screen { display: none; flex-direction: column; flex: 1; padding: 16px 16px 28px; animation: fadeIn .25s ease; }
  .screen.active { display: flex; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  h1, h2, h3 { margin: 0 0 6px; }
  p { margin: 0 0 10px; line-height: 1.6; }

  .topbar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    min-height: 44px;
  }
  .btn-back {
    background: var(--card-bg);
    border: 1px solid #d8e2df;
    border-radius: 12px;
    padding: 10px 14px;
    min-height: 44px;
    font-size: 15px;
    color: var(--ink);
    cursor: pointer;
  }
  .btn-back:active { background: #ecf3f1; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 14px 18px;
    min-height: 48px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    transition: transform .08s ease, background .15s ease;
    box-shadow: 0 3px 0 var(--accent-dark);
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-dark); }
  .btn.secondary {
    background: var(--card-bg);
    color: var(--accent-dark);
    border: 2px solid var(--accent);
    box-shadow: none;
  }
  .btn.secondary:active { background: #eaf5f3; }
  .btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; transform: none; }
  .btn-row { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }

  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: 0 1px 4px rgba(20, 40, 35, .08);
    margin-bottom: 12px;
  }

  /* ---- title screen ---- */
  .title-hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 4px;
  }
  .title-emoji { font-size: 64px; line-height: 1; margin-bottom: 6px; }
  .title-hero h1 { font-size: 26px; color: var(--accent-dark); }
  .title-hero .sub { color: var(--sub-ink); font-size: 14px; margin-bottom: 24px; }
  .title-buttons { width: 100%; display: flex; flex-direction: column; gap: 12px; padding: 0 8px; }
  .footer-note {
    text-align: center;
    font-size: 11px;
    color: var(--sub-ink);
    padding-top: 18px;
    line-height: 1.6;
  }

  /* ---- map screen ---- */
  .map-wrap {
    position: relative;
    width: 100%;
    background: var(--sea);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(20,40,35,.08);
  }
  .map-wrap svg { display: block; width: 100%; height: auto; }
  .legend {
    display: flex;
    gap: 16px;
    justify-content: center;
    font-size: 12px;
    color: var(--sub-ink);
    margin: 10px 0;
  }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--river-color); display: inline-block; }
  .legend-diamond { width: 12px; height: 12px; background: var(--dam-color); display: inline-block; transform: rotate(45deg); }

  .marker-dot { fill: var(--river-color); stroke: #fff; stroke-width: 1.5; cursor: pointer; }
  .marker-dam { fill: var(--dam-color); stroke: #fff; stroke-width: 1.5; cursor: pointer; }
  .marker-hit { fill: transparent; cursor: pointer; }
  .marker-selected { stroke: #ffd23f; stroke-width: 3; }
  .marker-label {
    font-size: 15px;
    fill: var(--ink);
    paint-order: stroke;
    stroke: #ffffffcc;
    stroke-width: 3px;
    pointer-events: none;
    font-weight: 700;
  }

  .info-card { display: none; }
  .info-card.show { display: block; }
  .info-card .badge-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .type-badge {
    font-size: 12px;
    padding: 3px 9px;
    border-radius: 999px;
    background: #eef4f2;
    color: var(--sub-ink);
  }

  /* ---- tackle screen ---- */
  .loc-heading { color: var(--accent-dark); font-size: 18px; }
  .choice-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
  .choice-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card-bg);
    border: 2px solid #e2ebe8;
    border-radius: 14px;
    padding: 12px 14px;
    min-height: 48px;
    cursor: pointer;
    text-align: left;
  }
  .choice-item .ci-emoji { font-size: 26px; width: 34px; text-align: center; }
  .choice-item .ci-text { flex: 1; }
  .choice-item .ci-name { font-weight: 700; font-size: 15px; }
  .choice-item .ci-desc { font-size: 12px; color: var(--sub-ink); margin-top: 2px; }
  .choice-item.selected { border-color: var(--accent); background: #eefaf6; }
  .section-label { font-size: 13px; color: var(--sub-ink); font-weight: 700; margin: 10px 0 6px; }

  /* ---- fishing screen ---- */
  .fish-stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    position: relative;
    background: linear-gradient(180deg, #bfe3ee 0%, #6fb6c9 60%, #4a94a8 100%);
    border-radius: var(--radius);
    overflow: hidden;
    min-height: 320px;
    margin-bottom: 16px;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .fish-stage .ripple {
    position: absolute;
    width: 40px;
    height: 40px;
    border: 3px solid #ffffff99;
    border-radius: 50%;
    animation: ripple 1.8s ease-out infinite;
  }
  @keyframes ripple {
    0% { width: 20px; height: 20px; opacity: .9; }
    100% { width: 160px; height: 160px; opacity: 0; }
  }
  .fish-stage .rod-emoji { font-size: 48px; z-index: 2; filter: drop-shadow(0 2px 3px rgba(0,0,0,.25)); }
  .stage-text {
    z-index: 3;
    margin-top: 14px;
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,.4);
    text-align: center;
    padding: 0 10px;
  }
  .fish-stage.biting { animation: shake .35s ease-in-out infinite; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }
  .fish-stage.biting .stage-text { font-size: 21px; color: #fff566; }

  /* ---- result screen ---- */
  .result-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .result-emoji { font-size: 84px; line-height: 1; margin-bottom: 8px; }
  .result-name { font-size: 24px; font-weight: 800; }
  .result-reading { font-size: 13px; color: var(--sub-ink); margin-bottom: 8px; }
  .new-badge {
    display: inline-block;
    background: #ffd23f;
    color: #6b4f00;
    font-weight: 800;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 8px;
  }
  .rarity-badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 999px;
    color: #fff;
    margin-bottom: 12px;
  }
  .rarity-common { background: var(--common); }
  .rarity-uncommon { background: var(--uncommon); }
  .rarity-rare { background: var(--rare); }
  .rarity-legend { background: var(--legend); }
  .result-desc { font-size: 14px; color: var(--sub-ink); max-width: 340px; margin-bottom: 18px; }
  .result-fail-emoji { font-size: 64px; margin-bottom: 8px; }
  .result-fail-title { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
  .result-fail-desc { font-size: 14px; color: var(--sub-ink); margin-bottom: 20px; }

  /* ---- zukan screen ---- */
  .zukan-summary {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .zukan-count { font-size: 20px; font-weight: 800; color: var(--accent-dark); }
  .rarity-breakdown { display: flex; gap: 10px; font-size: 11px; color: var(--sub-ink); flex-wrap: wrap; }
  .rarity-breakdown span { display: inline-flex; align-items: center; gap: 4px; }
  .rb-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .zukan-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .zukan-item {
    background: var(--card-bg);
    border-radius: 14px;
    padding: 10px 6px;
    text-align: center;
    border: 2px solid #e2ebe8;
    min-height: 90px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .zukan-item .zi-emoji { font-size: 30px; }
  .zukan-item .zi-name { font-size: 11px; font-weight: 700; margin-top: 4px; }
  .zukan-item .zi-rarity { font-size: 9px; color: var(--sub-ink); margin-top: 2px; }
  .zukan-item.locked { opacity: .55; }
  .zukan-item.locked .zi-emoji { filter: grayscale(1); }
  .zukan-item.common { border-color: var(--common); }
  .zukan-item.uncommon { border-color: var(--uncommon); }
  .zukan-item.rare { border-color: var(--rare); }
  .zukan-item.legend { border-color: var(--legend); box-shadow: 0 0 0 1px var(--legend) inset; }

  .hidden { display: none !important; }
  .sr-note { font-size: 12px; color: var(--sub-ink); }
</style>
</head>
<body>
<div id="app">

  <!-- 1. タイトル -->
  <section id="screen-title" class="screen active">
    <div class="title-hero">
      <div class="title-emoji">🎣🐟</div>
      <h1>北海道つりゲーム</h1>
      <div class="sub">実在の河川・ダムで、道産魚を釣り上げよう</div>
      <div class="title-buttons">
        <button class="btn" data-action="start">▶ 釣りを始める</button>
        <button class="btn secondary" data-action="zukan">📖 図鑑</button>
      </div>
    </div>
    <div class="footer-note">
      本作の河川・ダムと生息魚データは、国土交通省「河川水辺の国勢調査（河川環境データベース）」を参考にゲーム用に再構成したものです。魚のサイズ等は扱わず種類のみを対象とし、亜種・型は同一種として扱っています。
    </div>
  </section>

  <!-- 2. 地図選択 -->
  <section id="screen-map" class="screen">
    <div class="topbar">
      <button class="btn-back" data-action="back-to-title">← 戻る</button>
      <h2 style="font-size:16px;margin:0;">釣り場を選ぶ</h2>
    </div>
    <div class="map-wrap">
      <svg id="hokkaidoSvg" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="北海道地図"></svg>
    </div>
    <div class="legend">
      <span><span class="legend-dot"></span>河川</span>
      <span><span class="legend-diamond"></span>ダム</span>
    </div>
    <div id="infoCard" class="info-card card">
      <div class="badge-row">
        <span id="infoTypeBadge" class="type-badge"></span>
        <span id="infoRegionBadge" class="type-badge"></span>
      </div>
      <h3 id="infoName"></h3>
      <p id="infoDesc" class="sr-note"></p>
      <p class="sr-note">看板魚: <strong id="infoSignature"></strong></p>
      <button class="btn" data-action="go-tackle">ここで釣る</button>
    </div>
  </section>

  <!-- 3. タックル選択 -->
  <section id="screen-tackle" class="screen">
    <div class="topbar">
      <button class="btn-back" data-action="back-to-map">← 戻る</button>
      <h2 class="loc-heading" id="tackleLocName" style="font-size:16px;margin:0;"></h2>
    </div>
    <div class="section-label">① 竿を選ぶ</div>
    <div id="rodList" class="choice-list"></div>
    <div id="lureSection" class="hidden">
      <div class="section-label">② ルアー／エサを選ぶ</div>
      <div id="lureList" class="choice-list"></div>
    </div>
    <div class="btn-row">
      <button class="btn" id="startFishingBtn" data-action="start-fishing" disabled>🎣 釣り開始</button>
    </div>
  </section>

  <!-- 4. 釣り（キャスト & アタリ） -->
  <section id="screen-fish" class="screen">
    <div class="topbar">
      <h2 style="font-size:16px;margin:0;" id="fishLocName"></h2>
    </div>
    <div id="fishStage" class="fish-stage">
      <div class="ripple"></div>
      <div class="rod-emoji">🎣</div>
      <div class="stage-text" id="stageText">キャスト中…</div>
    </div>
    <p class="sr-note" style="text-align:center;">「アタリ！」の表示が出たら、素早くタップ！</p>
  </section>

  <!-- 5. 結果 -->
  <section id="screen-result" class="screen">
    <div id="resultCatch" class="result-wrap hidden">
      <div id="resultNewBadge" class="new-badge hidden">NEW!</div>
      <div class="result-emoji" id="resultEmoji"></div>
      <div class="result-name" id="resultName"></div>
      <div class="result-reading" id="resultReading"></div>
      <div id="resultRarity" class="rarity-badge"></div>
      <div class="result-desc" id="resultDesc"></div>
      <div class="btn-row" style="width:100%;">
        <button class="btn" data-action="retry-same">もう一度ここで釣る</button>
        <button class="btn secondary" data-action="change-place">場所を変える</button>
        <button class="btn secondary" data-action="zukan">図鑑を見る</button>
      </div>
    </div>
    <div id="resultFail" class="result-wrap hidden">
      <div class="result-fail-emoji" id="failEmoji">💨</div>
      <div class="result-fail-title" id="failTitle"></div>
      <div class="result-fail-desc" id="failDesc"></div>
      <div class="btn-row" style="width:100%;">
        <button class="btn" data-action="retry-same">もう一度</button>
      </div>
    </div>
  </section>

  <!-- 6. 図鑑 -->
  <section id="screen-zukan" class="screen">
    <div class="topbar">
      <button class="btn-back" data-action="back-any">← 戻る</button>
      <h2 style="font-size:16px;margin:0;">図鑑</h2>
    </div>
    <div class="zukan-summary">
      <div class="zukan-count" id="zukanCount">0 / 16</div>
      <div class="rarity-breakdown" id="rarityBreakdown"></div>
    </div>
    <div class="zukan-grid" id="zukanGrid"></div>
  </section>

</div>

  // ===== 投影（経度緯度 → SVG座標）SPEC §2 =====
  function project(lon, lat) {
    var x = (lon - 139.3) / (146.0 - 139.3) * 1000;
    var y = (45.7 - lat) / (45.7 - 41.2) * 1000;
    return [x, y];
  }

  // ===== 状態 =====
  var state = {
    selectedLocationId: null,
    selectedRodId: null,

    biteTimer: null,
    biteTimeoutTimer: null,
    biteActive: false,
    biteWindowMs: 1300,
    prevScreenBeforeZukan: "screen-title"
  };

  function loadZukan() {
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if (!raw) return {};
      var parsed = JSON.parse(raw);
      if (parsed && typeof parsed === "object" && parsed.caught && typeof parsed.caught === "object") {
        return parsed.caught;
      }
      return {};
    } catch (e) {
      return {};
    }
  }

  function saveZukan(caught) {
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: 1, caught: caught }));
    } catch (e) {
      /* localStorageが使えない環境でも無視して継続 */
    }
  }

  var zukan = loadZukan();

  function markCaught(fishId) {
    var isNew = !zukan[fishId];
    zukan[fishId] = true;
    saveZukan(zukan);
    return isNew;
  }

  // ===== 画面切替 =====
  function showScreen(id) {
    var screens = document.querySelectorAll(".screen");
    for (var i = 0; i < screens.length; i++) {
      screens[i].classList.toggle("active", screens[i].id === id);
    }
    window.scrollTo(0, 0);
  }

  function getLocation(id) {
    for (var i = 0; i < LOCATIONS.length; i++) {
      if (LOCATIONS[i].id === id) return LOCATIONS[i];
    }
    return null;
  }

  // ===== 地図描画 =====
  function buildMap() {
    var svg = document.getElementById("hokkaidoSvg");
    var parts = [];
    parts.push('<rect x="0" y="0" width="1000" height="1000" fill="var(--sea)"></rect>');

    var pts = COASTLINE.map(function (p) {
      var xy = project(p.lon, p.lat);
      return xy[0].toFixed(1) + "," + xy[1].toFixed(1);
    }).join(" ");
    parts.push('<polygon points="' + pts + '" fill="#dfe9d8" stroke="#8fae86" stroke-width="2.5"></polygon>');

    LOCATIONS.forEach(function (loc) {
      var xy = project(loc.lon, loc.lat);
      var x = xy[0].toFixed(1), y = xy[1].toFixed(1);
      var isDam = loc.type === "dam";
      parts.push('<g class="loc-marker-group" data-loc-id="' + loc.id + '">');
      if (isDam) {
        parts.push('<rect class="marker-dam" data-loc-id="' + loc.id + '" x="' + (xy[0] - 8) + '" y="' + (xy[1] - 8) + '" width="16" height="16" transform="rotate(45 ' + x + ' ' + y + ')"></rect>');
      } else {
        parts.push('<circle class="marker-dot" data-loc-id="' + loc.id + '" cx="' + x + '" cy="' + y + '" r="9"></circle>');
      }
      parts.push('<circle class="marker-hit" data-loc-id="' + loc.id + '" cx="' + x + '" cy="' + y + '" r="18"></circle>');
      parts.push('</g>');
    });

    svg.innerHTML = parts.join("");
    svg.addEventListener("click", onMapClick);
  }

  function onMapClick(e) {
    var target = e.target;
    var locId = target.getAttribute && target.getAttribute("data-loc-id");
    if (!locId) return;
    selectLocation(locId);
  }

  function selectLocation(locId) {
    state.selectedLocationId = locId;
    var loc = getLocation(locId);
    if (!loc) return;

    var svg = document.getElementById("hokkaidoSvg");
    var dots = svg.querySelectorAll(".marker-dot, .marker-dam");
    dots.forEach(function (d) {
      d.classList.toggle("marker-selected", d.getAttribute("data-loc-id") === locId);
    });
    var existingLabels = svg.querySelectorAll(".marker-label");
    existingLabels.forEach(function (l) { l.remove(); });
    var xy = project(loc.lon, loc.lat);
    var label = document.createElementNS("http://www.w3.org/2000/svg", "text");
    label.setAttribute("class", "marker-label");
    label.setAttribute("x", (xy[0] + 12).toFixed(1));
    label.setAttribute("y", (xy[1] - 12).toFixed(1));
    label.textContent = loc.name;
    svg.appendChild(label);

    document.getElementById("infoTypeBadge").textContent = loc.type === "river" ? "河川" : "ダム";
    document.getElementById("infoRegionBadge").textContent = loc.region;
    document.getElementById("infoName").textContent = loc.name;
    document.getElementById("infoDesc").textContent = loc.desc;
    var sigFish = FISH[loc.signature];
    document.getElementById("infoSignature").textContent = sigFish ? (sigFish.emoji + " " + sigFish.name) : loc.signature;
    document.getElementById("infoCard").classList.add("show");
  }

        '<div class="ci-emoji">' + rod.emoji + '</div>' +
        '<div class="ci-text"><div class="ci-name">' + rod.name + '</div><div class="ci-desc">' + rod.desc + '</div></div>';
      item.addEventListener("click", function () { selectRod(rod.id); });
      rodList.appendChild(item);
    });
  }

  function selectRod(rodId) {
    state.selectedRodId = rodId;
    state.selectedLureId = null;
    var rodList = document.getElementById("rodList");
    var items = rodList.querySelectorAll(".choice-item");
    items.forEach(function (it) {
      it.classList.toggle("selected", it.getAttribute("data-rod-id") === rodId);
    });

    var rod = RODS.filter(function (r) { return r.id === rodId; })[0];
    var lureSection = document.getElementById("lureSection");
    var lureList = document.getElementById("lureList");
    lureList.innerHTML = "";
    rod.lures.forEach(function (lureId) {
      var lure = LURES[lureId];
      var item = document.createElement("div");
      item.className = "choice-item";
      item.setAttribute("data-lure-id", lureId);
      item.innerHTML =
        '<div class="ci-emoji">' + lure.emoji + '</div>' +
        '<div class="ci-text"><div class="ci-name">' + lure.name + '</div><div class="ci-desc">' + lure.desc + '</div></div>';
      item.addEventListener("click", function () { selectLure(lureId); });
      lureList.appendChild(item);
    });
    lureSection.classList.remove("hidden");
    document.getElementById("startFishingBtn").disabled = true;
  }

  function selectLure(lureId) {
    state.selectedLureId = lureId;
    var lureList = document.getElementById("lureList");
    var items = lureList.querySelectorAll(".choice-item");
    items.forEach(function (it) {
      it.classList.toggle("selected", it.getAttribute("data-lure-id") === lureId);
    });
    document.getElementById("startFishingBtn").disabled = false;
  }

  // ===== 釣り演出 =====
  function startFishingSequence() {
    document.getElementById("fishLocName").textContent = (getLocation(state.selectedLocationId) || {}).name || "";
    showScreen("screen-fish");
    resetFishStage();

    var stage = document.getElementById("fishStage");
    var stageText = document.getElementById("stageText");
    stage.classList.remove("biting");
    stageText.textContent = "キャスト中…";
    state.biteActive = false;

    var delay = 1000 + Math.random() * 2500; // 1.0〜3.5秒
    clearFishingTimers();
    state.biteTimer = setTimeout(function () {
      stage.classList.add("biting");
      stageText.textContent = "！ アタリ！ タップ！";
      state.biteActive = true;
      state.biteTimeoutTimer = setTimeout(function () {
        if (state.biteActive) {
          state.biteActive = false;
          handleBarasi();
        }
      }, state.biteWindowMs);
    }, delay);
  }

  function resetFishStage() {
    clearFishingTimers();
    state.biteActive = false;
  }

  function clearFishingTimers() {
    if (state.biteTimer) { clearTimeout(state.biteTimer); state.biteTimer = null; }
    if (state.biteTimeoutTimer) { clearTimeout(state.biteTimeoutTimer); state.biteTimeoutTimer = null; }
  }

  function onFishStageTap() {
    if (!state.biteActive) return; // キャスト中のタップは無視
    state.biteActive = false;
    clearFishingTimers();
    handleHitSuccess();
  }

  // ===== 抽選ロジック（SPEC §5） =====
  function drawFish(locationId, lureId) {
    // 1. ボウズ判定 15%
    if (Math.random() < 0.15) {
      return null;
    }
    var loc = getLocation(locationId);
    var multipliers = LURE_MULTIPLIERS[lureId] || {};
    var pool = loc.fish;
    var weighted = [];
    var total = 0;
    Object.keys(pool).forEach(function (fid) {
      var base = pool[fid];
      var mult = multipliers[fid] !== undefined ? multipliers[fid] : 1.0;
      var w = base * mult;
      if (w > 0) {
        total += w;
        weighted.push({ id: fid, w: w });
      }
    });
    if (total <= 0 || weighted.length === 0) return null;
    var r = Math.random() * total;
    var acc = 0;
    for (var i = 0; i < weighted.length; i++) {
      acc += weighted[i].w;
      if (r < acc) return weighted[i].id;
    }
    return weighted[weighted.length - 1].id;
  }

  function handleHitSuccess() {
    var fishId = drawFish(state.selectedLocationId, state.selectedLureId);
    if (!fishId) {
      handleBouzu();
      return;
    }
    var isNew = markCaught(fishId);
    state.lastCaughtFishId = fishId;
    state.lastResultKind = "catch";
    renderResultCatch(fishId, isNew);
    showScreen("screen-result");
  }

  function handleBouzu() {
    state.lastResultKind = "bouzu";
    renderResultFail("😶", "ボウズ…", "今日はアタリはあったけど、魚は姿を見せてくれなかった。");
    showScreen("screen-result");
  }

  function handleBarasi() {
    state.lastResultKind = "barasi";
    renderResultFail("💨", "バラシ！逃げられた…", "アタリへの反応が少し遅れたみたい。もう一度チャレンジ！");
    showScreen("screen-result");
  }

  function renderResultCatch(fishId, isNew) {
    document.getElementById("resultCatch").classList.remove("hidden");
    document.getElementById("resultFail").classList.add("hidden");
    var fish = FISH[fishId];
    document.getElementById("resultNewBadge").classList.toggle("hidden", !isNew);
    document.getElementById("resultEmoji").textContent = fish.emoji;
    document.getElementById("resultName").textContent = fish.name;
    document.getElementById("resultReading").textContent = fish.reading;
    var rarityEl = document.getElementById("resultRarity");
    rarityEl.textContent = RARITY_LABEL[fish.rarity] || fish.rarity;
    rarityEl.className = "rarity-badge rarity-" + fish.rarity;
    document.getElementById("resultDesc").textContent = fish.desc;
  }

  function renderResultFail(emoji, title, desc) {
    document.getElementById("resultCatch").classList.add("hidden");
    document.getElementById("resultFail").classList.remove("hidden");
    document.getElementById("failEmoji").textContent = emoji;
    document.getElementById("failTitle").textContent = title;
    document.getElementById("failDesc").textContent = desc;
  }

  // ===== 図鑑画面 =====
  function renderZukan() {
    var fishIds = Object.keys(FISH);
    var caughtCount = fishIds.filter(function (id) { return !!zukan[id]; }).length;
    document.getElementById("zukanCount").textContent = caughtCount + " / " + fishIds.length;

    var rarityOrder = ["common", "uncommon", "rare", "legend"];
    var rarityTotals = { common: 0, uncommon: 0, rare: 0, legend: 0 };
    var rarityCaught = { common: 0, uncommon: 0, rare: 0, legend: 0 };
    fishIds.forEach(function (id) {
      var r = FISH[id].rarity;
      rarityTotals[r]++;
      if (zukan[id]) rarityCaught[r]++;
    });
    var breakdown = document.getElementById("rarityBreakdown");
    breakdown.innerHTML = rarityOrder.map(function (r) {
      return '<span><span class="rb-dot" style="background:var(--' + r + ')"></span>' +
        RARITY_LABEL[r] + " " + rarityCaught[r] + "/" + rarityTotals[r] + "</span>";
    }).join("");

    var grid = document.getElementById("zukanGrid");
    grid.innerHTML = "";
    fishIds.forEach(function (id) {
      var fish = FISH[id];
      var caught = !!zukan[id];
      var item = document.createElement("div");
      item.className = "zukan-item " + fish.rarity + (caught ? "" : " locked");
      if (caught) {
        item.innerHTML =
          '<div class="zi-emoji">' + fish.emoji + '</div>' +
          '<div class="zi-name">' + fish.name + '</div>' +
          '<div class="zi-rarity">' + RARITY_LABEL[fish.rarity] + '</div>';
      } else {
        item.innerHTML =
          '<div class="zi-emoji">❔</div>' +
          '<div class="zi-name">？？？</div>' +
          '<div class="zi-rarity">未捕獲</div>';
      }
      grid.appendChild(item);
    });
  }

  // ===== イベント配線 =====
  document.addEventListener("click", function (e) {
    var el = e.target.closest ? e.target.closest("[data-action]") : null;
    if (!el) return;
    var action = el.getAttribute("data-action");
    switch (action) {
      case "start":
        showScreen("screen-map");
        break;
      case "zukan":
        state.prevScreenBeforeZukan = currentScreenId();
        renderZukan();
        showScreen("screen-zukan");
        break;
      case "back-to-title":
        showScreen("screen-title");
        break;
      case "back-to-map":
        showScreen("screen-map");
        break;
      case "back-any":
        showScreen(state.prevScreenBeforeZukan || "screen-title");
        break;
      case "go-tackle":
        if (state.selectedLocationId) {
          renderTackleScreen();
          showScreen("screen-tackle");
        }
        break;
      case "start-fishing":
        if (state.selectedRodId && state.selectedLureId) {
          startFishingSequence();
        }
        break;
      case "retry-same":
        startFishingSequence();
        break;
      case "change-place":
        showScreen("screen-map");
        break;
      default:
        break;
    }
  });

  document.getElementById("fishStage").addEventListener("click", onFishStageTap);

  function currentScreenId() {
    var active = document.querySelector(".screen.active");
    return active ? active.id : "screen-title";
  }

  // ===== 初期化 =====
  buildMap();
  showScreen("screen-title");
})();
</script>
</body>
</html>
