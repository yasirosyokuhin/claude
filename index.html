<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>北海道つりゲーム</title>
<style>
  :root {
    --sea: #cfe8f2;
    --land: #dfe9d8;
    --land-line: #8fae86;
    --river-color: #2e7ab8;
    --dam-color: #b8622e;
    --bg: #f4f8f6;
    --card-bg: #ffffff;
    --ink: #1f2d2a;
    --sub-ink: #5a6d68;
    --accent: #1c7f79;
    --accent-dark: #135b56;
    --danger: #b3492f;
    --common: #8b98a0;
    --uncommon: #3f9d63;
    --rare: #3b74c4;
    --legend: #c99a2e;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    overflow-x: hidden;
    width: 100%;
  }
  body {
    display: flex;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
  }
  #app {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow-x: hidden;
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .screen { display: none; flex-direction: column; flex: 1; padding: 16px 16px 28px; animation: fadeIn .25s ease; }
  .screen.active { display: flex; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  h1, h2, h3 { margin: 0 0 6px; }
  p { margin: 0 0 10px; line-height: 1.6; }

  .topbar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    min-height: 44px;
  }
  .btn-back {
    background: var(--card-bg);
    border: 1px solid #d8e2df;
    border-radius: 12px;
    padding: 10px 14px;
    min-height: 44px;
    font-size: 15px;
    color: var(--ink);
    cursor: pointer;
  }
  .btn-back:active { background: #ecf3f1; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 14px 18px;
    min-height: 48px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    transition: transform .08s ease, background .15s ease;
    box-shadow: 0 3px 0 var(--accent-dark);
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-dark); }
  .btn.secondary {
    background: var(--card-bg);
    color: var(--accent-dark);
    border: 2px solid var(--accent);
    box-shadow: none;
  }
  .btn.secondary:active { background: #eaf5f3; }
  .btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; transform: none; }
  .btn-row { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }

  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: 0 1px 4px rgba(20, 40, 35, .08);
    margin-bottom: 12px;
  }

  /* ---- title screen ---- */
  .title-hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 4px;
  }
  .title-fish-art { margin: 0 auto 10px; width: 220px; max-width: 70%; }
  .title-fish-art svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 4px 10px rgba(20,60,50,.25)); }
  .title-hero h1 { font-size: 26px; color: var(--accent-dark); }
  .title-hero .sub { color: var(--sub-ink); font-size: 14px; margin-bottom: 24px; }
  .title-buttons { width: 100%; display: flex; flex-direction: column; gap: 12px; padding: 0 8px; }
  .footer-note {
    text-align: center;
    font-size: 11px;
    color: var(--sub-ink);
    padding-top: 18px;
    line-height: 1.6;
  }

  /* ---- map screen ---- */
  .map-wrap {
    position: relative;
    width: 100%;
    background: var(--sea);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(20,40,35,.08);
  }
  .map-wrap svg { display: block; width: 100%; height: auto; touch-action: none; }
  .map-hint { text-align: center; font-size: 11px; color: var(--sub-ink); margin-top: 6px; }
  .legend {
    display: flex;
    gap: 16px;
    justify-content: center;
    font-size: 12px;
    color: var(--sub-ink);
    margin: 10px 0;
  }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--river-color); display: inline-block; }
  .legend-diamond { width: 12px; height: 12px; background: var(--dam-color); display: inline-block; transform: rotate(45deg); }

  .marker-dot { fill: var(--river-color); stroke: #fff; stroke-width: 1.5; cursor: pointer; }
  .marker-dam { fill: var(--dam-color); stroke: #fff; stroke-width: 1.5; cursor: pointer; }
  .marker-hit { fill: transparent; cursor: pointer; }
  .marker-selected { stroke: #ffd23f; stroke-width: 3; }
  .marker-label {
    font-size: 15px;
    fill: var(--ink);
    paint-order: stroke;
    stroke: #ffffffcc;
    stroke-width: 3px;
    pointer-events: none;
    font-weight: 700;
  }

  .info-card { display: none; }
  .info-card.show { display: block; }
  .info-card .badge-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .type-badge {
    font-size: 12px;
    padding: 3px 9px;
    border-radius: 999px;
    background: #eef4f2;
    color: var(--sub-ink);
  }
  .info-fish-art { width: 100%; display: flex; justify-content: center; margin: 4px 0 8px; }
  .info-fish-art svg { height: 56px; width: auto; display: block; }

  /* ---- tackle screen ---- */
  .loc-heading { color: var(--accent-dark); font-size: 18px; }
  .choice-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
  .choice-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card-bg);
    border: 2px solid #e2ebe8;
    border-radius: 14px;
    padding: 12px 14px;
    min-height: 48px;
    cursor: pointer;
    text-align: left;
  }
  .choice-item .ci-emoji { font-size: 26px; width: 34px; text-align: center; }
  .choice-item .ci-text { flex: 1; }
  .choice-item .ci-name { font-weight: 700; font-size: 15px; }
  .choice-item .ci-desc { font-size: 12px; color: var(--sub-ink); margin-top: 2px; }
  .choice-item.selected { border-color: var(--accent); background: #eefaf6; }
  .section-label { font-size: 13px; color: var(--sub-ink); font-weight: 700; margin: 10px 0 6px; }

  /* ---- fishing screen ---- */
  .fish-stage {
    position: relative;
    width: 100%;
    aspect-ratio: 360 / 420;
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 12px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    background: #cfe6ee;
  }
  .stage-scene { position: absolute; inset: 0; }
  .stage-scene svg { width: 100%; height: 100%; display: block; }
  #rodLayer { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
  #rodLayer svg { width: 100%; height: 100%; display: block; }
  .stage-badges { position: absolute; top: 8px; right: 8px; z-index: 4; display: flex; gap: 6px; }
  .time-badge {
    font-size: 11px; font-weight: 700; color: #fff;
    background: rgba(20,45,40,.38); padding: 3px 9px; border-radius: 999px;
  }
  .time-badge.mazume { background: rgba(196,110,20,.75); }
  .mute-btn {
    position: absolute; bottom: 10px; right: 10px; z-index: 7;
    width: 40px; height: 40px; border-radius: 50%; border: none;
    background: rgba(20,45,40,.4); color: #fff; font-size: 18px; cursor: pointer;
  }
  /* --- fight gauges --- */
  .fight-ui {
    position: absolute; left: 10px; right: 10px; top: 40px; z-index: 5;
    display: none; flex-direction: column; gap: 6px; pointer-events: none;
  }
  .fight-ui.show { display: flex; }
  .gauge-row { display: flex; align-items: center; gap: 8px; }
  .gauge-name {
    width: 58px; font-size: 10px; font-weight: 700; color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.5); text-align: right; flex: none;
    white-space: nowrap;
  }
  .gauge-track {
    position: relative; flex: 1; height: 14px; border-radius: 7px;
    background: rgba(10,25,30,.45); overflow: hidden;
  }
  .gauge-zone {
    position: absolute; top: 0; bottom: 0; left: 35%; width: 40%;
    background: rgba(110,220,140,.28);
    border-left: 1px solid rgba(180,255,200,.5); border-right: 1px solid rgba(180,255,200,.5);
  }
  #tensionFill {
    position: absolute; top: 2px; bottom: 2px; left: 2px; width: 50%;
    border-radius: 6px; background: #7ede96; transition: background .15s;
  }
  #tensionFill.warn { background: #f0c34e; }
  #tensionFill.danger { background: #e8604c; }
  #progressFill {
    position: absolute; top: 2px; bottom: 2px; left: 2px; width: 0%;
    border-radius: 6px; background: linear-gradient(90deg, #57b7c9, #7ee0d2);
  }
  .fight-hint {
    text-align: center; font-size: 11px; font-weight: 700; color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,.6);
  }
  .fish-stage.pulling { animation: shake .28s ease-in-out infinite; }
  .fish-stage.reeling-grip { outline: 3px solid rgba(255,255,255,.35); outline-offset: -3px; }
  /* landed fish leap */
  .fish-leap {
    position: absolute; left: 50%; top: 58%; width: 55%; z-index: 6;
    transform: translate(-50%, -50%);
    animation: fishLeap 1s cubic-bezier(.2,.8,.3,1) forwards;
    pointer-events: none;
    filter: drop-shadow(0 6px 8px rgba(0,20,30,.35));
  }
  .fish-leap svg { width: 100%; height: auto; display: block; }
  @keyframes fishLeap {
    0%   { transform: translate(-50%, 30%) rotate(30deg) scale(.6); opacity: 0; }
    30%  { transform: translate(-50%, -60%) rotate(-12deg) scale(1); opacity: 1; }
    60%  { transform: translate(-50%, -78%) rotate(-4deg) scale(1.04); }
    100% { transform: translate(-50%, -52%) rotate(2deg) scale(1); opacity: 1; }
  }
  .drop { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #eaf6fa; z-index: 6; pointer-events: none; animation: dropFall .7s ease-in forwards; }
  @keyframes dropFall {
    from { transform: translate(0, 0); opacity: .95; }
    to { transform: translate(var(--dx), 90px); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .fish-stage.pulling, .fish-stage.biting { animation: none; }
  }
  .stage-label {
    position: absolute;
    top: 8px;
    left: 8px;
    z-index: 4;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    background: rgba(20,45,40,.38);
    padding: 3px 9px;
    border-radius: 999px;
    text-shadow: 0 1px 2px rgba(0,0,0,.3);
  }
  .fish-shadow-wrap {
    display: none;
    position: absolute;
    left: 34.7%;
    top: 68%;
    width: 30.6%;
    z-index: 2;
    opacity: .38;
    filter: blur(1.5px);
    pointer-events: none;
    animation: fishWiggle 1s ease-in-out infinite alternate;
  }
  .fish-shadow-wrap.show { display: block; }
  .fish-shadow-wrap svg { width: 100%; height: auto; display: block; }
  @keyframes fishWiggle {
    from { transform: translateX(-8px); }
    to { transform: translateX(8px); }
  }
  .splash-dot {
    position: absolute;
    left: 50%;
    top: 69%;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ffffff;
    transform: translate(-50%, -50%);
    animation: splashFly .5s ease-out forwards;
    pointer-events: none;
    z-index: 6;
  }
  @keyframes splashFly {
    from { transform: translate(-50%, -50%) translate(0, 0); opacity: 1; }
    to { transform: translate(-50%, -50%) translate(var(--dx), var(--dy)); opacity: 0; }
  }
  .stage-text {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 12px;
    z-index: 5;
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,.4);
    text-align: center;
    padding: 0 10px;
  }
  .fish-stage.biting { animation: shake .35s ease-in-out infinite; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }
  .fish-stage.biting .stage-text { font-size: 21px; color: #fff566; }

  /* ---- result screen ---- */
  .result-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #resultCatch { background: linear-gradient(180deg, #eaf6fa 0%, #f4fbf8 100%); border-radius: 20px; padding: 22px 14px; }
  .result-fish-wrap { position: relative; width: 100%; display: flex; justify-content: center; margin-bottom: 6px; }
  .result-fish-glow { position: absolute; inset: -10px; border-radius: 50%; filter: blur(18px); z-index: 0; }
  .result-fish-art { position: relative; z-index: 1; width: min(320px, 80%); }
  .result-fish-art svg { width: 100%; height: auto; display: block; }
  .result-name { font-size: 24px; font-weight: 800; }
  .result-reading { font-size: 13px; color: var(--sub-ink); margin-bottom: 8px; }
  .new-badge {
    display: inline-block;
    background: #ffd23f;
    color: #6b4f00;
    font-weight: 800;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 8px;
  }
  .rarity-badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 999px;
    color: #fff;
    margin-bottom: 12px;
  }
  .rarity-common { background: var(--common); }
  .rarity-uncommon { background: var(--uncommon); }
  .rarity-rare { background: var(--rare); }
  .rarity-legend { background: var(--legend); }
  .result-desc { font-size: 14px; color: var(--sub-ink); max-width: 340px; margin-bottom: 18px; }
  .result-fail-emoji { font-size: 64px; margin-bottom: 8px; }
  .result-fail-title { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
  .result-fail-desc { font-size: 14px; color: var(--sub-ink); margin-bottom: 20px; }

  /* ---- zukan screen ---- */
  .zukan-summary {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .zukan-count { font-size: 20px; font-weight: 800; color: var(--accent-dark); }
  .rarity-breakdown { display: flex; gap: 10px; font-size: 11px; color: var(--sub-ink); flex-wrap: wrap; }
  .rarity-breakdown span { display: inline-flex; align-items: center; gap: 4px; }
  .rb-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .zukan-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .zukan-item {
    background: var(--card-bg);
    border-radius: 14px;
    padding: 10px 8px;
    text-align: center;
    border: 2px solid #e2ebe8;
    min-height: 128px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .zukan-item .zi-art { width: 100%; display: flex; justify-content: center; }
  .zukan-item .zi-art svg { width: 90%; max-height: 68px; height: auto; display: block; }
  .zukan-item .zi-name { font-size: 12px; font-weight: 700; margin-top: 4px; }
  .zukan-item .zi-rarity { font-size: 10px; color: var(--sub-ink); margin-top: 2px; }
  .zukan-item.locked { opacity: .6; }
  .zukan-item.common { border-color: var(--common); }
  .zukan-item.uncommon { border-color: var(--uncommon); }
  .zukan-item.rare { border-color: var(--rare); }
  .zukan-item.legend { border-color: var(--legend); box-shadow: 0 0 0 1px var(--legend) inset; }

  .hidden { display: none !important; }
  .sr-note { font-size: 12px; color: var(--sub-ink); }
</style>
</head>
<body>
<div id="app">

  <!-- 1. タイトル -->
  <section id="screen-title" class="screen active">
    <div class="title-hero">
      <div id="titleFishArt" class="title-fish-art"></div>
      <h1>北海道つりゲーム</h1>
      <div class="sub">実在の河川・ダムで、道産魚を釣り上げよう</div>
      <div class="title-buttons">
        <button class="btn" data-action="start">▶ 釣りを始める</button>
        <button class="btn secondary" data-action="zukan">📖 図鑑</button>
      </div>
    </div>
    <div class="footer-note">
      本作の河川・ダムと生息魚データは、国土交通省「河川水辺の国勢調査（河川環境データベース）」を参考にゲーム用に再構成したものです。魚のサイズ等は扱わず種類のみを対象とし、亜種・型は同一種として扱っています。
    </div>
  </section>

  <!-- 2. 地図選択 -->
  <section id="screen-map" class="screen">
    <div class="topbar">
      <button class="btn-back" data-action="back-to-title">← 戻る</button>
      <h2 style="font-size:16px;margin:0;">釣り場を選ぶ</h2>
    </div>
    <div class="map-wrap">
      <svg id="hokkaidoSvg" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="北海道地図"></svg>
    </div>
    <div class="legend">
      <span><span class="legend-dot"></span>河川</span>
      <span><span class="legend-diamond"></span>ダム</span>
    </div>
    <div class="map-hint">ピンチで拡大 / ドラッグで移動（地図の枠内のみ）</div>
    <div id="infoCard" class="info-card card">
      <div class="badge-row">
        <span id="infoTypeBadge" class="type-badge"></span>
        <span id="infoRegionBadge" class="type-badge"></span>
      </div>
      <h3 id="infoName"></h3>
      <p id="infoDesc" class="sr-note"></p>
      <div id="infoSignatureArt" class="info-fish-art"></div>
      <p class="sr-note">看板魚: <strong id="infoSignature"></strong></p>
      <button class="btn" data-action="go-tackle">ここで釣る</button>
    </div>
  </section>

  <!-- 3. タックル選択 -->
  <section id="screen-tackle" class="screen">
    <div class="topbar">
      <button class="btn-back" data-action="back-to-map">← 戻る</button>
      <h2 class="loc-heading" id="tackleLocName" style="font-size:16px;margin:0;"></h2>
    </div>
    <div class="section-label">① 竿を選ぶ</div>
    <div id="rodList" class="choice-list"></div>
    <div id="lureSection" class="hidden">
      <div class="section-label">② ルアー／エサを選ぶ</div>
      <div id="lureList" class="choice-list"></div>
    </div>
    <div class="btn-row">
      <button class="btn" id="startFishingBtn" data-action="start-fishing" disabled>🎣 釣り開始</button>
    </div>
  </section>

  <!-- 4. 釣り（キャスト & アタリ） -->
  <section id="screen-fish" class="screen">
    <div class="topbar">
      <h2 style="font-size:16px;margin:0;" id="fishLocName"></h2>
    </div>
    <div id="fishStage" class="fish-stage">
      <div id="stageScene" class="stage-scene"></div>
      <div id="stageLabel" class="stage-label"></div>
      <div class="stage-badges"><span id="timeBadge" class="time-badge"></span></div>
      <div id="fishShadowWrap" class="fish-shadow-wrap"></div>
      <div id="rodLayer"></div>
      <div id="fightUi" class="fight-ui">
        <div class="gauge-row">
          <span class="gauge-name">テンション</span>
          <div class="gauge-track"><div class="gauge-zone"></div><div id="tensionFill"></div></div>
        </div>
        <div class="gauge-row">
          <span class="gauge-name">寄せ</span>
          <div class="gauge-track"><div id="progressFill"></div></div>
        </div>
        <div class="fight-hint">長押しで巻く！ 引きが強い時は離してしのげ！</div>
      </div>
      <div class="stage-text" id="stageText">キャスト中…</div>
      <button id="muteBtn" class="mute-btn" type="button">🔊</button>
    </div>
    <p class="sr-note" style="text-align:center;" id="fishHelpNote">アタリが来たらタップでアワセ→長押しで巻き上げ！</p>
  </section>

  <!-- 5. 結果 -->
  <section id="screen-result" class="screen">
    <div id="resultCatch" class="result-wrap hidden">
      <div id="resultNewBadge" class="new-badge hidden">NEW!</div>
      <div class="result-fish-wrap">
        <div id="resultFishGlow" class="result-fish-glow"></div>
        <div id="resultFishArt" class="result-fish-art"></div>
      </div>
      <div class="result-name" id="resultName"></div>
      <div class="result-reading" id="resultReading"></div>
      <div id="resultRarity" class="rarity-badge"></div>
      <div class="result-desc" id="resultDesc"></div>
      <div class="btn-row" style="width:100%;">
        <button class="btn" data-action="retry-same">もう一度ここで釣る</button>
        <button class="btn secondary" data-action="change-place">場所を変える</button>

<script>
// fishart.js — parametric SVG fish illustration system (fable5)
// Each species: silhouette params + color layers + pattern layers.
// viewBox 0 0 240 120, fish faces left.

function mulberry(seed){let t=seed>>>0;return()=>{t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,1|t);r^=r+Math.imul(r^r>>>7,61|r);return((r^r>>>14)>>>0)/4294967296}}

// --- body path builders -------------------------------------------------
// standard fusiform body; d=half-depth at mid, L body end x, nose x=26, mid-y 62
function bodyPath(p){
  const d=p.depth, L=p.len, ph=p.pedH, nose=26, midY=62;
  const hx=nose+(L-nose)*0.32;            // head/back transition
  const mx=nose+(L-nose)*0.52;            // deepest point
  const snout=p.snout||0;                  // 0 pointed, 1 blunt
  const jawDrop=p.jawDrop||0;              // kype hook
  return `M ${nose} ${midY-3-snout*2}
    C ${nose+8} ${midY-d*0.55} ${hx-14} ${midY-d*0.92} ${mx} ${midY-d}
    C ${mx+34} ${midY-d} ${L-22} ${midY-ph-4} ${L} ${midY-ph}
    L ${L} ${midY+ph}
    C ${L-22} ${midY+ph+4} ${mx+34} ${midY+d*1.02} ${mx-6} ${midY+d*1.02}
    C ${hx-16} ${midY+d*0.98} ${nose+7} ${midY+8+jawDrop} ${nose} ${midY+3+snout*2}
    Z`;
}
// caudal fin
function tailPath(p){
  const L=p.len, ph=p.pedH, midY=62, t=p.tail||'fork', ext=p.tailLen||26;
  if(t==='fork') return `M ${L} ${midY-ph} C ${L+10} ${midY-ph-6} ${L+ext-6} ${midY-ph-16} ${L+ext} ${midY-ph-14} C ${L+ext-9} ${midY-4} ${L+ext-9} ${midY+4} ${L+ext} ${midY+ph+14} C ${L+ext-6} ${midY+ph+16} ${L+10} ${midY+ph+6} ${L} ${midY+ph} Z`;
  if(t==='trunc') return `M ${L} ${midY-ph} C ${L+12} ${midY-ph-8} ${L+ext} ${midY-ph-10} ${L+ext} ${midY-ph-6} L ${L+ext} ${midY+ph+6} C ${L+ext} ${midY+ph+10} ${L+12} ${midY+ph+8} ${L} ${midY+ph} Z`;
  /* round */ return `M ${L} ${midY-ph} C ${L+16} ${midY-ph-10} ${L+ext+4} ${midY-8} ${L+ext+4} ${midY} C ${L+ext+4} ${midY+8} ${L+16} ${midY+ph+10} ${L} ${midY+ph} Z`;
}
function dorsalPath(p){
  const L=p.len, d=p.depth, midY=62, x=26+(L-26)*0.47, w=p.dorsalW||26, h=p.dorsalH||16;
  return `M ${x} ${midY-d+3} C ${x+4} ${midY-d-h} ${x+w*0.7} ${midY-d-h*0.9} ${x+w} ${midY-d-2} C ${x+w*0.6} ${midY-d+2} ${x+w*0.3} ${midY-d+3} ${x} ${midY-d+3} Z`;
}
function adiposePath(p){
  const L=p.len, midY=62, ph=p.pedH, x=L-16;
  const y=midY-ph-7;
  return `M ${x} ${y+4} q 5 -7 11 -1 q -5 4 -11 -3 Z`;
}
function pectoralPath(p){
  const x=26+(p.len-26)*0.30, y=62+p.depth*0.42, s=p.finS||1;
  return `M ${x} ${y} q ${14*s} ${2*s} ${22*s} ${13*s} q ${-13*s} ${5*s} ${-24*s} ${-4*s} Z`;
}
function pelvicPath(p){
  const x=26+(p.len-26)*0.52, y=62+p.depth*0.96;
  return `M ${x} ${y} q 9 8 16 10 q -10 3 -18 -3 Z`;
}
function analPath(p){
  const x=26+(p.len-26)*0.74, y=62+p.depth*0.72;
  return `M ${x} ${y} q 6 9 14 11 q -9 2 -17 -3 Z`;
}
// patterns --------------------------------------------------------------
function spots(p,o,rng){ // o:{n,color,rMin,rMax,halo,yMin,yMax,op}
  let s='';
  const x0=34, x1=p.len+ (o.onTail? p.tailLen*0.5 : -6);
  for(let i=0;i<o.n;i++){
    const x=x0+rng()*(x1-x0);
    const frac=(x-26)/(p.len-26);
    const dHere=p.depth*(frac<0.5? 0.55+frac*0.9 : 1.45-frac*0.9);
    const yr=(o.yMin??-1)+rng()*((o.yMax??0.75)-(o.yMin??-1));
    const y=62+yr*dHere;
    const r=o.rMin+rng()*(o.rMax-o.rMin);
    if(o.halo) s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(r+1.6).toFixed(1)}" fill="${o.halo}" opacity="0.85"/>`;
    s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${o.color}" opacity="${o.op??0.85}"/>`;
  }
  return s;
}
function parrMarks(p,o){ // o:{n,color,op}
  let s='';const x0=26+(p.len-26)*0.24, x1=26+(p.len-26)*0.92;
  for(let i=0;i<o.n;i++){
    const x=x0+(x1-x0)*i/(o.n-1);
    const frac=(x-26)/(p.len-26);
    const dHere=p.depth*(frac<0.5? 0.6+frac*0.8 : 1.4-frac*0.8);
    s+=`<ellipse cx="${x.toFixed(1)}" cy="62" rx="${(4+p.depth*0.06).toFixed(1)}" ry="${(dHere*0.62).toFixed(1)}" fill="${o.color}" opacity="${o.op??0.5}"/>`;
  }
  return s;
}
function lateralBand(p,o){ // o:{color,op,w}
  return `<path d="M 30 62 C ${26+(p.len-26)*0.3} ${62-2} ${26+(p.len-26)*0.7} ${62-1} ${p.len+10} 62 L ${p.len+10} ${62+(o.w||9)} C ${26+(p.len-26)*0.7} ${62+(o.w||9)+1} ${26+(p.len-26)*0.3} ${62+(o.w||9)} 30 ${62+(o.w||9)-2} Z" fill="${o.color}" opacity="${o.op??0.5}"/>`;
}

// --- main renderer ------------------------------------------------------
function fishSVG(sp, opts={}){
  const p=sp.body;
  const id='f'+sp.id+(opts.uid||'');
  const rng=mulberry(sp.seed||42);
  const silhouette=opts.silhouette;
  const W=240,H=120;
  let defs=`<linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${sp.back}"/>
      <stop offset="0.45" stop-color="${sp.side}"/>
      <stop offset="0.72" stop-color="${sp.belly}"/>
      <stop offset="1" stop-color="${sp.belly}"/>
    </linearGradient>
    <clipPath id="${id}c"><path d="${bodyPath(p)}"/></clipPath>`;
  const finFill=silhouette?'#26343b':(sp.fin||sp.back);
  const bodyFill=silhouette?'#26343b':`url(#${id}g)`;
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}"><defs>${defs}</defs>`;
  // fins behind body
  s+=`<path d="${tailPath(p)}" fill="${finFill}" opacity="${silhouette?1:0.92}"/>`;
  if(sp.rays!==false&&!silhouette){ // tail rays
    s+=`<path d="${tailPath(p)}" fill="none" stroke="${sp.finRay||'#00000022'}" stroke-width="0.8"/>`;
  }
  s+=`<path d="${dorsalPath(p)}" fill="${finFill}" opacity="${silhouette?1:0.95}"/>`;
  if(sp.adipose&&(true)) s+=`<path d="${adiposePath(p)}" fill="${finFill}" opacity="${silhouette?1:0.95}"/>`;
  s+=`<path d="${pelvicPath(p)}" fill="${finFill}" opacity="${silhouette?1:0.9}"/>`;
  s+=`<path d="${analPath(p)}" fill="${finFill}" opacity="${silhouette?1:0.9}"/>`;
  // body
  s+=`<path d="${bodyPath(p)}" fill="${bodyFill}" stroke="${silhouette?'#26343b':sp.outline||'#00000033'}" stroke-width="1"/>`;
  // pattern layers clipped to body
  if(!silhouette){
    s+=`<g clip-path="url(#${id}c)">`;
    // back shading
    s+=`<path d="M 20 ${62-p.depth} L ${p.len+8} ${62-p.pedH-4} L ${p.len+8} 30 L 20 30 Z" fill="${sp.back}" opacity="0.35"/>`;
    for(const layer of (sp.layers||[])){
      if(layer.t==='band') s+=lateralBand(p,layer);
      if(layer.t==='parr') s+=parrMarks(p,layer);
      if(layer.t==='spots') s+=spots(p,layer,rng);
      if(layer.t==='scales'){ // subtle scale arcs
        let sc='';for(let i=0;i<layer.n;i++){const x=40+rng()*(p.len-50),y=62-p.depth*0.8+rng()*p.depth*1.6;
          sc+=`<path d="M ${x.toFixed(1)} ${y.toFixed(1)} a 4 4 0 0 1 6 0" fill="none" stroke="${layer.color}" stroke-width="0.7" opacity="${layer.op??0.35}"/>`;}
        s+=sc;
      }
    }
    // gill cover
    const gx=26+(p.len-26)*0.26;
    s+=`<path d="M ${gx} ${62-p.depth*0.78} C ${gx+9} ${62-p.depth*0.25} ${gx+9} ${62+p.depth*0.3} ${gx-3} ${62+p.depth*0.8}" fill="none" stroke="#00000030" stroke-width="1.6"/>`;
    // belly sheen
    s+=`<ellipse cx="${26+(p.len-26)*0.45}" cy="${62+p.depth*0.55}" rx="${(p.len-26)*0.35}" ry="${p.depth*0.3}" fill="#ffffff" opacity="0.18"/>`;
    s+=`</g>`;
    // pectoral on top of body
    s+=`<path d="${pectoralPath(p)}" fill="${finFill}" opacity="0.92"/>`;
    // eye
    const ex=26+(p.len-26)*0.13, ey=62-p.depth*0.22;
    s+=`<circle cx="${ex}" cy="${ey}" r="${p.eye||4.4}" fill="#1c2226"/><circle cx="${ex}" cy="${ey}" r="${(p.eye||4.4)*0.85}" fill="#3a4a52"/><circle cx="${ex}" cy="${ey}" r="${(p.eye||4.4)*0.45}" fill="#10151a"/><circle cx="${ex-1.2}" cy="${ey-1.4}" r="1.1" fill="#ffffffcc"/>`;
    // mouth
    s+=`<path d="M ${26.5} ${62+2} q 7 ${4+(p.jawDrop||0)} 13 ${3+(p.jawDrop||0)*0.6}" fill="none" stroke="#00000055" stroke-width="1.4"/>`;
    if(sp.barbels){
      s+=`<path d="M 33 ${62+7} q -2 6 -6 8 M 39 ${62+8} q -1 6 -5 9" fill="none" stroke="${sp.side}" stroke-width="1.6" stroke-linecap="round"/>`;
    }
  } else {
    s+=`<path d="${pectoralPath(p)}" fill="#26343b"/>`;
  }
  s+=`</svg>`;
  return s;
}

// --- special: lamprey ----------------------------------------------------
function lampreySVG(sp,opts={}){
  const sil=opts.silhouette, id='f'+sp.id+(opts.uid||'');
  const body=`M 22 58 C 60 50 150 49 206 56 C 214 58 214 66 206 67 C 150 73 60 72 22 66 C 17 64 17 60 22 58 Z`;
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120"><defs>
    <linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${sp.back}"/><stop offset="0.6" stop-color="${sp.side}"/><stop offset="1" stop-color="${sp.belly}"/>
    </linearGradient><clipPath id="${id}c"><path d="${body}"/></clipPath></defs>`;
  const fill=sil?'#26343b':`url(#${id}g)`;
  // low dorsal ridge fins
  s+=`<path d="M 120 52 C 140 46 165 46 185 50 L 185 56 C 165 52 140 52 120 56 Z" fill="${sil?'#26343b':sp.fin}" opacity="0.9"/>`;
  s+=`<path d="M 190 52 C 205 46 216 50 224 60 C 216 70 205 74 190 68 Z" fill="${sil?'#26343b':sp.fin}" opacity="0.95"/>`;
  s+=`<path d="${body}" fill="${fill}" stroke="${sil?'#26343b':'#00000033'}" stroke-width="1"/>`;
  if(!sil){
    s+=`<g clip-path="url(#${id}c)"><path d="M 18 50 L 220 46 L 220 58 L 18 58 Z" fill="${sp.back}" opacity="0.4"/></g>`;
    // oral sucker
    s+=`<ellipse cx="24" cy="62" rx="5" ry="6.5" fill="#5b4048"/><ellipse cx="24" cy="62" rx="3" ry="4.4" fill="#2e2126"/>`;
    // eye + 7 gill pores
    s+=`<circle cx="38" cy="57" r="3.2" fill="#141a1e"/><circle cx="37" cy="56" r="1" fill="#fff" opacity="0.7"/>`;
    for(let i=0;i<7;i++) s+=`<circle cx="${48+i*5.5}" cy="61.5" r="1.4" fill="#1d262b" opacity="0.85"/>`;
  }
  s+=`</svg>`;
  return s;
}

// --- special: sculpin (kajika) -------------------------------------------
function sculpinSVG(sp,opts={}){
  const sil=opts.silhouette, id='f'+sp.id+(opts.uid||'');
  const rng=mulberry(sp.seed||7);
  const body=`M 24 56 C 34 42 62 38 88 42 C 130 40 176 50 200 58 C 206 60 206 64 200 66 C 176 72 130 78 88 76 C 60 80 34 76 24 68 C 19 64 20 60 24 56 Z`;
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120"><defs>
   <linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sp.back}"/><stop offset="0.6" stop-color="${sp.side}"/><stop offset="1" stop-color="${sp.belly}"/></linearGradient>
   <clipPath id="${id}c"><path d="${body}"/></clipPath></defs>`;
  const fin=sil?'#26343b':sp.fin;
  // long spiny dorsal
  s+=`<path d="M 86 42 L 92 28 L 100 40 L 110 27 L 118 39 L 128 28 L 136 40 L 148 31 L 154 42 L 170 36 L 176 46 L 86 46 Z" fill="${fin}" opacity="0.9"/>`;
  // tail round
  s+=`<path d="M 198 56 C 212 48 224 50 230 62 C 224 74 212 76 198 66 Z" fill="${fin}"/>`;
  s+=`<path d="${body}" fill="${sil?'#26343b':`url(#${id}g)`}" stroke="${sil?'#26343b':'#00000033'}" stroke-width="1"/>`;
  if(!sil){
    s+=`<g clip-path="url(#${id}c)">`;
    // mottling
    for(let i=0;i<26;i++){const x=30+rng()*180,y=42+rng()*34,r=2+rng()*5;
      s+=`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${r.toFixed(1)}" ry="${(r*0.7).toFixed(1)}" fill="${sp.mottle}" opacity="${0.25+rng()*0.3}"/>`;}
    s+=`</g>`;
    // huge fan pectoral
    s+=`<path d="M 74 62 Q 96 60 106 84 Q 84 92 66 76 Z" fill="${fin}" opacity="0.95"/>
        <path d="M 74 62 L 104 82 M 74 62 L 96 86 M 74 62 L 86 88" stroke="#00000030" stroke-width="1" fill="none"/>`;
    // wide mouth + eyes on top
    s+=`<circle cx="46" cy="47" r="4.6" fill="#151b1f"/><circle cx="45" cy="45.6" r="1.3" fill="#fff" opacity="0.75"/>`;
    s+=`<path d="M 24 60 q 14 8 30 8" fill="none" stroke="#00000060" stroke-width="2"/>`;
  }
  s+=`</svg>`;
  return s;
}

  // ===== 地図: 河川ポリライン上への最近傍点計算 =====
  function nearestPointOnSegment(px, py, ax, ay, bx, by) {
    var dx = bx - ax, dy = by - ay;
    var lenSq = dx * dx + dy * dy;
    var t = lenSq > 0 ? ((px - ax) * dx + (py - ay) * dy) / lenSq : 0;
    t = Math.max(0, Math.min(1, t));
    return [ax + t * dx, ay + t * dy];
  }

  function nearestPointOnPolyline(px, py, projectedPts) {
    var best = projectedPts[0], bestD = Infinity;
    for (var i = 0; i < projectedPts.length - 1; i++) {
      var cp = nearestPointOnSegment(px, py, projectedPts[i][0], projectedPts[i][1], projectedPts[i + 1][0], projectedPts[i + 1][1]);
      var dx = cp[0] - px, dy = cp[1] - py;
      var dd = dx * dx + dy * dy;
      if (dd < bestD) { bestD = dd; best = cp; }
    }
    return best;
  }

  // ===== 地図描画（SPEC2 §1: 実海岸線・湖・河川12本） =====
  function buildMap() {
    var svg = document.getElementById("hokkaidoSvg");
    var parts = [];

    // 1. 海（上から下への微グラデ）
    parts.push('<defs><linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="#bcd9e6"/><stop offset="1" stop-color="#cfe8f2"/></linearGradient></defs>');
    parts.push('<rect x="0" y="0" width="1000" height="1000" fill="url(#seaGrad)"></rect>');

    // 2. グラティキュール（1度ごと、極細線）
    for (var lon = 140; lon <= 146; lon++) {
      var ga = project(lon, 41.2), gb = project(lon, 45.7);
      parts.push('<line x1="' + ga[0].toFixed(1) + '" y1="' + ga[1].toFixed(1) + '" x2="' + gb[0].toFixed(1) + '" y2="' + gb[1].toFixed(1) + '" stroke="#ffffff55" stroke-width="1"></line>');
    }
    for (var lat = 42; lat <= 45; lat++) {
      var gc = project(139.3, lat), gd = project(146.0, lat);
      parts.push('<line x1="' + gc[0].toFixed(1) + '" y1="' + gc[1].toFixed(1) + '" x2="' + gd[0].toFixed(1) + '" y2="' + gd[1].toFixed(1) + '" stroke="#ffffff55" stroke-width="1"></line>');
    }

    // 3. 陸（実海岸線 GEO.main + 離島 GEO.islands）。白いアウターグローの上に陸本体。
    function landPolygon(points) {
      var pts = points.map(function (p) {
        var xy = project(p[0], p[1]);
        return xy[0].toFixed(1) + "," + xy[1].toFixed(1);
      }).join(" ");
      parts.push('<polygon points="' + pts + '" fill="none" stroke="#ffffff66" stroke-width="4"></polygon>');
      parts.push('<polygon points="' + pts + '" fill="#e3ead9" stroke="#94ac8a" stroke-width="1.5"></polygon>');
    }
    landPolygon(GEO.main);
    GEO.islands.forEach(landPolygon);

    // 4. 湖（実在位置の近似形・ガーニッシュ）
    var kx = 1000 / 6.7, ky = 1000 / 4.5;
    LAKES.forEach(function (lk) {
      var c = project(lk.cx, lk.cy);
      var rx = (lk.rx * kx).toFixed(1), ry = (lk.ry * ky).toFixed(1);
      var rot = lk.rot ? ' transform="rotate(' + lk.rot + ' ' + c[0].toFixed(1) + ' ' + c[1].toFixed(1) + ')"' : '';
      parts.push('<ellipse cx="' + c[0].toFixed(1) + '" cy="' + c[1].toFixed(1) + '" rx="' + rx + '" ry="' + ry + '" fill="#a9cede" stroke="#8db8cc"' + rot + '></ellipse>');
    });

    // 5. 河川12本（石狩川はGEO.ishikariの実ポリライン、他11本は実流路ウェイポイント）
    var riverProjPoints = {};
    function drawRiver(id, segments) {
      var lastProj = null;
      segments.forEach(function (seg) {
        var proj = seg.map(function (p) { return project(p[0], p[1]); });
        lastProj = proj;
        var d = proj.map(function (p, i) { return (i === 0 ? "M " : "L ") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" ");
        parts.push('<path d="' + d + '" fill="none" stroke="#4a90c2" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"></path>');
      });
      riverProjPoints[id] = lastProj;
    }
    drawRiver("ishikari", GEO.ishikari);
    Object.keys(RIVER_WAYPOINTS).forEach(function (id) {
      drawRiver(id, [RIVER_WAYPOINTS[id]]);
    });

    // 6. マーカー（河川はそのポリライン上の最近傍点へスナップ、ダムはv1座標のまま）
    markerPositions = {};
    LOCATIONS.forEach(function (loc) {
      var xy;
      if (loc.type === "river" && riverProjPoints[loc.id]) {
        var target = project(loc.lon, loc.lat);
        xy = nearestPointOnPolyline(target[0], target[1], riverProjPoints[loc.id]);
      } else {
        xy = project(loc.lon, loc.lat);
      }
      markerPositions[loc.id] = xy;
      var x = xy[0].toFixed(1), y = xy[1].toFixed(1);
      var isDam = loc.type === "dam";
      parts.push('<g class="loc-marker-group" data-loc-id="' + loc.id + '">');
      if (isDam) {
        parts.push('<rect class="marker-dam" data-loc-id="' + loc.id + '" x="' + (xy[0] - 8) + '" y="' + (xy[1] - 8) + '" width="16" height="16" transform="rotate(45 ' + x + ' ' + y + ')"></rect>');
      } else {
        parts.push('<circle class="marker-dot" data-loc-id="' + loc.id + '" cx="' + x + '" cy="' + y + '" r="9"></circle>');
      }
      parts.push('<circle class="marker-hit" data-loc-id="' + loc.id + '" cx="' + x + '" cy="' + y + '" r="18"></circle>');
      parts.push('</g>');
    });

    svg.innerHTML = '<g id="mapViewport">' + parts.join("") + '</g>';
    initMapZoom(svg);
  }

  // ===== 地図のピンチズーム／パン（地図の枠内のみで動作。ページ自体は拡大しない）=====
  var mapZoom = { s: 1, tx: 0, ty: 0 };
  function initMapZoom(svg) {
    var vp = svg.querySelector("#mapViewport");
    var pointers = new Map();
    var moved = 0;
    var lastDist = 0, lastMid = null;

    function apply() {
      mapZoom.s = Math.max(1, Math.min(6, mapZoom.s));
      mapZoom.tx = Math.min(0, Math.max(1000 * (1 - mapZoom.s), mapZoom.tx));
      mapZoom.ty = Math.min(0, Math.max(1000 * (1 - mapZoom.s), mapZoom.ty));
      vp.setAttribute("transform", "translate(" + mapZoom.tx.toFixed(1) + " " + mapZoom.ty.toFixed(1) + ") scale(" + mapZoom.s.toFixed(3) + ")");
      // ズーム時にマーカーとラベルが巨大化しないよう逆スケール
      var k = 1 / Math.pow(mapZoom.s, 0.62);
      svg.querySelectorAll(".loc-marker-group").forEach(function (g) {
        var id = g.getAttribute("data-loc-id");

        if (p) g.setAttribute("transform", "translate(" + p[0] + " " + p[1] + ") scale(" + k.toFixed(3) + ") translate(" + (-p[0]) + " " + (-p[1]) + ")");
      });

        var ax = parseFloat(lbl.getAttribute("data-ax")), ay = parseFloat(lbl.getAttribute("data-ay"));
        if (!isNaN(ax)) lbl.setAttribute("transform", "translate(" + ax + " " + ay + ") scale(" + k.toFixed(3) + ") translate(" + (-ax) + " " + (-ay) + ")");
      });
    }
    mapZoom.apply = apply;

    function toLocal(e) {
      var r = svg.getBoundingClientRect();
      var f = 1000 / r.width;
      return [(e.clientX - r.left) * f, (e.clientY - r.top) * f];
    }

    svg.addEventListener("pointerdown", function (e) {
      try { svg.setPointerCapture(e.pointerId); } catch (err) {}
      pointers.set(e.pointerId, toLocal(e));
      if (pointers.size === 1) moved = 0;
      if (pointers.size === 2) {
        var a = Array.from(pointers.values());
        lastDist = Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]);
        lastMid = [(a[0][0] + a[1][0]) / 2, (a[0][1] + a[1][1]) / 2];
      }
      e.preventDefault();
    });

    svg.addEventListener("pointermove", function (e) {
      if (!pointers.has(e.pointerId)) return;
      var prev = pointers.get(e.pointerId);
      var cur = toLocal(e);
      pointers.set(e.pointerId, cur);
      if (pointers.size === 1) {
        mapZoom.tx += cur[0] - prev[0];
        mapZoom.ty += cur[1] - prev[1];
        moved += Math.hypot(cur[0] - prev[0], cur[1] - prev[1]);
        apply();
      } else if (pointers.size === 2) {
        var a = Array.from(pointers.values());
        var dist = Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]);
        var mid = [(a[0][0] + a[1][0]) / 2, (a[0][1] + a[1][1]) / 2];
        var factor = lastDist > 0 ? dist / lastDist : 1;
        var cx = (mid[0] - mapZoom.tx) / mapZoom.s;
        var cy = (mid[1] - mapZoom.ty) / mapZoom.s;
        var ns = Math.max(1, Math.min(6, mapZoom.s * factor));
        mapZoom.s = ns;
        mapZoom.tx = mid[0] - cx * ns + (lastMid ? mid[0] - lastMid[0] : 0);
        mapZoom.ty = mid[1] - cy * ns + (lastMid ? mid[1] - lastMid[1] : 0);
        moved += 10;
        lastDist = dist;
        lastMid = mid;
        apply();
      }
    });

    function endPointer(e) {
      if (!pointers.has(e.pointerId)) return;
      var wasSingle = pointers.size === 1;
      pointers.delete(e.pointerId);
      if (pointers.size < 2) { lastDist = 0; lastMid = null; }
      // タップ（ほぼ動いていない）ならマーカー選択
      if (wasSingle && moved < 8 && e.type === "pointerup") {
        var el = document.elementFromPoint(e.clientX, e.clientY);
        var hit = el && el.closest ? el.closest("[data-loc-id]") : null;
        if (hit) selectLocation(hit.getAttribute("data-loc-id"));
      }
    }
    svg.addEventListener("pointerup", endPointer);
    svg.addEventListener("pointercancel", endPointer);

    // デスクトップ: ホイールで拡大縮小
    svg.addEventListener("wheel", function (e) {
      e.preventDefault();
      var pt = toLocal(e);
      var factor = Math.pow(1.0015, -e.deltaY);
      var cx = (pt[0] - mapZoom.tx) / mapZoom.s;
      var cy = (pt[1] - mapZoom.ty) / mapZoom.s;
      var ns = Math.max(1, Math.min(6, mapZoom.s * factor));
      mapZoom.s = ns;
      mapZoom.tx = pt[0] - cx * ns;
      mapZoom.ty = pt[1] - cy * ns;
      apply();
    }, { passive: false });

    // ダブルタップ/ダブルクリックでズーム切替
    var lastTapAt = 0, lastTapXY = null;
    svg.addEventListener("pointerup", function (e) {
      var now = Date.now();
      var pt = toLocal(e);
      if (now - lastTapAt < 320 && lastTapXY && Math.hypot(pt[0] - lastTapXY[0], pt[1] - lastTapXY[1]) < 40 && moved < 8) {
        var target = mapZoom.s > 1.5 ? 1 : 2.6;
        var cx = (pt[0] - mapZoom.tx) / mapZoom.s;
        var cy = (pt[1] - mapZoom.ty) / mapZoom.s;
        mapZoom.s = target;
        mapZoom.tx = pt[0] - cx * target;
        mapZoom.ty = pt[1] - cy * target;
        apply();
        lastTapAt = 0;
      } else {
        lastTapAt = now;
        lastTapXY = pt;
      }
    });
  }

    var svg = document.getElementById("hokkaidoSvg");

    label.setAttribute("class", "marker-label");

  // ===== 情景シーン（SPEC2 §2） =====
  function seedFromString(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h += s.charCodeAt(i);
    return h;
  }

  function ridgePath(rng, yBase, yVar, opacity, fill) {
    var pts = [];
    for (var i = 0; i <= 8; i++) {
      pts.push([i * 45, yBase + (rng() * 2 - 1) * yVar]);
    }
    var d = "M 0 150 L " + pts[0][0] + " " + pts[0][1].toFixed(1) + " ";
    for (var j = 1; j < pts.length; j++) {
      d += "L " + pts[j][0] + " " + pts[j][1].toFixed(1) + " ";
    }
    d += "L 360 150 Z";
    return '<path d="' + d + '" fill="' + fill + '" opacity="' + opacity + '"></path>';
  }

  // ===== 時間帯（実時刻でマズメ・夜を判定）=====
  function timeInfo() {
    var h = new Date().getHours();
    if (h >= 5 && h < 8)  return { key: "asa",  label: "朝マズメ", mazume: true,  night: false };
    if (h >= 16 && h < 19) return { key: "yuu", label: "夕マズメ", mazume: true,  night: false };
    if (h >= 19 || h < 5) return { key: "yoru", label: "夜釣り",   mazume: false, night: true };
    return { key: "hiru", label: "日中", mazume: false, night: false };
  }

      for (var k = 0; k < 3; k++) {

  // ===== 効果音（Web Audio 合成・外部ファイルなし）=====
  var SFX = (function () {
    var ctx = null, master = null, ambGain = null, ambNodes = [];
    var muted = false;
    try { muted = localStorage.getItem("hf_muted_v1") === "1"; } catch (e) {}
    function ensure() {
      try {
        if (!ctx) {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return false;
          ctx = new AC();
          master = ctx.createGain();
          master.gain.value = muted ? 0 : 0.55;
          master.connect(ctx.destination);
        }
        if (ctx.state === "suspended") ctx.resume();
        return true;
      } catch (e) { return false; }
    }
    function noiseBuf(dur) {
      var b = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
      var d = b.getChannelData(0);
      var last = 0;
      for (var i = 0; i < d.length; i++) { // 軽いローパスでピンクノイズ風
        var w = Math.random() * 2 - 1;
        last = last * 0.94 + w * 0.06;
        d[i] = last * 3.2;
      }
      return b;
    }
    function env(g, t0, a, peak, dec) {
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(peak, t0 + a);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + dec);
    }
    function blip(freq, type, peak, dec, when, slideTo) {
      if (!ensure()) return;
      var t0 = ctx.currentTime + (when || 0);
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t0);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dec);
      env(g, t0, 0.005, peak, dec);
      o.connect(g); g.connect(master);
      o.start(t0); o.stop(t0 + dec + 0.1);
    }
    function noise(peak, dec, fq, when, type) {
      if (!ensure()) return;
      var t0 = ctx.currentTime + (when || 0);
      var src = ctx.createBufferSource(); src.buffer = noiseBuf(dec + 0.1);
      var f = ctx.createBiquadFilter(); f.type = type || "lowpass"; f.frequency.value = fq;
      var g = ctx.createGain(); env(g, t0, 0.01, peak, dec);
      src.connect(f); f.connect(g); g.connect(master);
      src.start(t0); src.stop(t0 + dec + 0.15);
    }
    return {
      ensure: ensure,
      whoosh: function () { noise(0.25, 0.32, 1800, 0, "bandpass"); },
      plop: function () { blip(340, "sine", 0.5, 0.16, 0, 90); noise(0.18, 0.12, 900); },
      bite: function () { blip(140, "sine", 0.6, 0.09, 0, 70); blip(120, "sine", 0.5, 0.09, 0.12, 60); },
      click: function () { blip(2300, "square", 0.05, 0.018); },
      snap: function () { blip(900, "sawtooth", 0.4, 0.08, 0, 200); noise(0.3, 0.2, 2400, 0.02, "highpass"); },
      splash: function () { noise(0.5, 0.5, 1100); noise(0.25, 0.7, 500, 0.08); },
      jingle: function () {
        blip(523, "triangle", 0.30, 0.28, 0);
        blip(659, "triangle", 0.30, 0.28, 0.13);
        blip(784, "triangle", 0.34, 0.42, 0.26);
        blip(1047, "triangle", 0.26, 0.6, 0.42);
      },
      fail: function () { blip(330, "triangle", 0.25, 0.3, 0); blip(247, "triangle", 0.25, 0.42, 0.18); },
      ambience: function (type) {
        if (!ensure()) return;
        this.stopAmbience();
        var src = ctx.createBufferSource(); src.buffer = noiseBuf(2.2); src.loop = true;
        var f = ctx.createBiquadFilter(); f.type = "lowpass";
        f.frequency.value = type === "river" ? 780 : 430;
        ambGain = ctx.createGain(); ambGain.gain.value = type === "river" ? 0.11 : 0.055;
        var lfo = ctx.createOscillator(), lg = ctx.createGain();
        lfo.frequency.value = type === "river" ? 0.5 : 0.22; lg.gain.value = type === "river" ? 0.03 : 0.015;
        lfo.connect(lg); lg.connect(ambGain.gain);
        src.connect(f); f.connect(ambGain); ambGain.connect(master);
        src.start(); lfo.start();
        ambNodes = [src, lfo];
      },
      stopAmbience: function () {
        ambNodes.forEach(function (n) { try { n.stop(); } catch (e) {} });
        ambNodes = [];
        if (ambGain) { try { ambGain.disconnect(); } catch (e) {} ambGain = null; }
      },
      setMuted: function (m) {
        muted = m;
        try { localStorage.setItem("hf_muted_v1", m ? "1" : "0"); } catch (e) {}
        if (master) master.gain.value = m ? 0 : 0.55;
      },
      muted: function () { return muted; }
    };
  })();

  function buzz(pattern) {
    try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
  }

  // ===== ロッド＆ライン描画（rAFで毎フレーム更新）=====
  var rodRefs = null;
  function buildRodLayer() {
    var layer = document.getElementById("rodLayer");
    layer.innerHTML = '<svg viewBox="0 0 360 420" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">' +
      '<path id="linePath" d="" fill="none" stroke="#f8f8f4" stroke-opacity="0.75" stroke-width="1.3"/>' +
      '<path id="rodPath" d="" fill="none" stroke="#5a4632" stroke-width="5.5" stroke-linecap="round"/>' +
      '<path id="rodHiPath" d="" fill="none" stroke="#8a7050" stroke-width="2" stroke-linecap="round"/>' +
      '<g id="reelG"><circle cx="322" cy="399" r="9.5" fill="#3a3f44" stroke="#22262a" stroke-width="2"/>' +
      '<line id="reelHandle" x1="322" y1="399" x2="330" y2="391" stroke="#c9ced2" stroke-width="2.5" stroke-linecap="round"/></g>' +
      '</svg>';
    rodRefs = {
      line: layer.querySelector("#linePath"),
      rod: layer.querySelector("#rodPath"),
      rodHi: layer.querySelector("#rodHiPath"),
      handle: layer.querySelector("#reelHandle")
    };
  }

  // bend 0..1（テンションで竿がしなる）、target = ライン先端 [x,y] or null
  function drawRod(bend, target, reelAngle) {
    if (!rodRefs) return;
    var baseX = 336, baseY = 428;
    var tipX = 224 - bend * 34, tipY = 208 + bend * 52;
    var ctrlX = 300 - bend * 8, ctrlY = 330 + bend * 20;
    var d = "M " + baseX + " " + baseY + " Q " + ctrlX + " " + ctrlY + " " + tipX.toFixed(1) + " " + tipY.toFixed(1);
    rodRefs.rod.setAttribute("d", d);
    rodRefs.rodHi.setAttribute("d", d);
    if (target) {
      var sag = bend > 0.35 ? -4 : 16 - bend * 30;
      var mx = (tipX + target[0]) / 2, my = Math.min(tipY, target[1]) + sag;
      rodRefs.line.setAttribute("d", "M " + tipX.toFixed(1) + " " + tipY.toFixed(1) + " Q " + mx.toFixed(1) + " " + my.toFixed(1) + " " + target[0].toFixed(1) + " " + target[1].toFixed(1));
    } else {
      rodRefs.line.setAttribute("d", "");
    }
    var a = reelAngle || 0;
    rodRefs.handle.setAttribute("x2", (322 + Math.cos(a) * 8.5).toFixed(1));
    rodRefs.handle.setAttribute("y2", (399 + Math.sin(a) * 8.5).toFixed(1));
  }

  // ===== 釣りフェーズ管理 =====
  var FIGHT_STAMINA = { common: 4.2, uncommon: 5.6, rare: 7.2, legend: 10.5 };
  var FIGHT_PULL = { common: 0.7, uncommon: 0.85, rare: 1.0, legend: 1.28 };

  var fs = {
    phase: "idle", raf: null, lastTs: 0,
    castT: 0, bobX: 224, bobY: 208, idleT: 0,
    holding: false, tension: 55, progress: 0,
    pulling: false, nextPullAt: 0, pullEndAt: 0,
    slackTime: 0, reelAngle: 0, lastClickAt: 0,
    fightFishId: null, fpX: 180, fpY: 300
  };

  function sceneEl(id) {
    var scene = document.getElementById("stageScene");
    return scene ? scene.querySelector("#" + id) : null;
  }

  function startFishingSequence() {
    var loc = getLocation(state.selectedLocationId);
    document.getElementById("fishLocName").textContent = loc ? loc.name : "";
    showScreen("screen-fish");
    resetFishStage();
    state.time = timeInfo();

    document.getElementById("muteBtn").textContent = SFX.muted() ? "🔇" : "🔊";

    SFX.ensure();
    if (loc) SFX.ambience(loc.type);

    state.biteActive = false;
    state.pendingFishId = undefined;

    fs.phase = "cast";
    fs.castT = 0;
    fs.idleT = 0;
    fs.tension = 55; fs.progress = 0; fs.holding = false;
    fs.slackTime = 0; fs.pulling = false;

    setStageText("キャスト！");
    SFX.whoosh();

    var waitMs = state.time.mazume ? (800 + Math.random() * 1700) : (1200 + Math.random() * 2800);
    clearFishingTimers();
    state.biteTimer = setTimeout(function () { triggerBite(); }, 750 + waitMs);
    startStageLoop();
  }

  function triggerBite() {
    if (fs.phase !== "wait" && fs.phase !== "cast") return;
    var bouzuRate = state.time && state.time.mazume ? 0.08 : 0.15;
    state.pendingFishId = drawFish(state.selectedLocationId, state.selectedLureId, bouzuRate);
    showFishShadow(state.pendingFishId);
    fs.phase = "bite";
    var stage = document.getElementById("fishStage");
    stage.classList.add("biting");
    setStageText(state.pendingFishId ? "！！ アタリ！ タップでアワセ！" : "！ ウキが動いた！ タップ！", true);
    SFX.bite();
    buzz(70);
    state.biteActive = true;
    state.biteTimeoutTimer = setTimeout(function () {
      if (state.biteActive) {
        state.biteActive = false;
        endFishing("late");
      }
    }, state.biteWindowMs);
  }

  function hookset() {
    state.biteActive = false;
    clearFishingTimers();
    var stage = document.getElementById("fishStage");
    stage.classList.remove("biting");
    spawnSplash();
    SFX.splash();
    buzz([30, 40, 40]);
    if (!state.pendingFishId) {
      // 藻・ゴミ
      fs.phase = "junk";
      clearFishShadow();
      setStageText("…手応えが軽い…");
      setTimeout(function () { endFishing("bouzu"); }, 800);
      return;
    }
    // ファイト開始
    fs.phase = "fight";
    fs.fightFishId = state.pendingFishId;
    fs.tension = 55; fs.progress = 0;
    fs.slackTime = 0; fs.holding = false;
    fs.pulling = false;
    fs.nextPullAt = performance.now() + 600 + Math.random() * 800;
    document.getElementById("fightUi").classList.add("show");
    setStageText("長押しで巻け！", true);
  }

  function fightTick(now, dt) {
    var fish = FISH[fs.fightFishId] || { rarity: "common" };
    var pull = FIGHT_PULL[fish.rarity] || 0.8;
    var stage = document.getElementById("fishStage");

    // 魚の引きバースト
    if (!fs.pulling && now >= fs.nextPullAt) {
      fs.pulling = true;
      fs.pullEndAt = now + 320 + Math.random() * 480;
      stage.classList.add("pulling");
      buzz(35);
    }
    if (fs.pulling && now >= fs.pullEndAt) {
      fs.pulling = false;
      fs.nextPullAt = now + 500 + Math.random() * 950;
      stage.classList.remove("pulling");
    }

    // テンション物理: 巻く=上昇 / 引き=上昇 / 離す=低下
    var delta = (fs.holding ? 58 : -46) + (fs.pulling ? 46 * pull : 0);
    fs.tension = Math.max(0, Math.min(100, fs.tension + delta * dt));

    // リール音
    if (fs.holding) {
      fs.reelAngle += dt * 9;
      if (now - fs.lastClickAt > 95) { SFX.click(); fs.lastClickAt = now; }
    }

    // 寄せ進行
    var inGreen = fs.tension >= 35 && fs.tension <= 75;
    var stamina = FIGHT_STAMINA[fish.rarity] || 5;
    fs.progress = Math.max(0, Math.min(100, fs.progress + (inGreen ? (100 / stamina) : -7) * dt));

    // たるみ判定
    if (fs.tension <= 1) fs.slackTime += dt; else fs.slackTime = 0;

    // UI更新
    var tf = document.getElementById("tensionFill");
    tf.style.width = Math.max(2, fs.tension) + "%";
    tf.className = fs.tension > 88 ? "danger" : (fs.tension > 75 || fs.tension < 22 ? "warn" : "");
    document.getElementById("progressFill").style.width = fs.progress + "%";

    // 魚の暴れ位置（ラインの先端）
    fs.fpX = 180 + Math.sin(now / 320) * (fs.pulling ? 62 : 34);
    fs.fpY = 296 + Math.sin(now / 210) * (fs.pulling ? 16 : 7);
    var wrap = document.getElementById("fishShadowWrap");
    wrap.style.left = ((fs.fpX - 55) / 360 * 100) + "%";
    wrap.style.top = ((fs.fpY - 12) / 420 * 100) + "%";

    // 決着
    if (fs.tension >= 100) { endFishing("break"); return; }
    if (fs.slackTime > 1.1) { endFishing("off"); return; }
    if (fs.progress >= 100) { landFish(); return; }
  }

  function landFish() {
    fs.phase = "land";
    var fishId = fs.fightFishId;
    document.getElementById("fightUi").classList.remove("show");
    document.getElementById("fishStage").classList.remove("pulling");
    clearFishShadow();
    setStageText("ヒット！ランディング成功！", true);
    SFX.splash();
    setTimeout(function () { SFX.jingle(); }, 220);
    buzz([40, 60, 120]);
    // 魚が水面から跳ねる
    var stage = document.getElementById("fishStage");
    var leap = document.createElement("div");
    leap.className = "fish-leap";
    leap.innerHTML = renderFish(fishId, { uid: "leap" });
    stage.appendChild(leap);
    for (var i = 0; i < 8; i++) {
      var drop = document.createElement("div");
      drop.className = "drop";
      drop.style.left = (42 + Math.random() * 16) + "%";
      drop.style.top = (52 + Math.random() * 10) + "%";
      drop.style.setProperty("--dx", ((Math.random() * 2 - 1) * 70).toFixed(0) + "px");
      stage.appendChild(drop);
      (function (el) { setTimeout(function () { el.remove(); }, 750); })(drop);
    }
    setTimeout(function () {
      leap.remove();
      handleHitSuccess(fishId);
    }, 1150);
  }

  var FAIL_INFO = {
    late:  { emoji: "💨", title: "アワセ遅れ！", desc: "アタリへの反応が遅れて、魚は消えた…。次は素早くタップ！", kind: "barasi" },
    break: { emoji: "💥", title: "ラインブレイク！", desc: "強い引きに巻き続けて糸が切れた！引きが強い時は指を離していなそう。", kind: "barasi" },
    off:   { emoji: "🫧", title: "バレた…", desc: "糸がたるんで針が外れた。テンションを保ち続けよう。", kind: "barasi" },
    bouzu: { emoji: "🌿", title: "藻だった…", desc: "アタリに見えたのは流れてきた藻。今日はこんな日もある。", kind: "bouzu" }
  };

  function endFishing(failKey) {

  // ===== ステージ描画ループ =====
  function startStageLoop() {
    stopStageLoop();
    fs.lastTs = performance.now();
    function tick(now) {
      fs.raf = requestAnimationFrame(tick);
      var dt = Math.min(0.05, (now - fs.lastTs) / 1000);
      fs.lastTs = now;
      var bobber = sceneEl("bobberG");
      var ripple = sceneEl("rippleG");

      if (fs.phase === "cast") {
        fs.castT += dt;
        var p = Math.min(1, fs.castT / 0.7);
        // 竿先(224,208)から着水点(180,288)へ放物線
        var bx = 224 - (224 - 180) * p;
        var by = 208 + (288 - 208) * p - Math.sin(p * Math.PI) * 60;
        if (bobber) {
          bobber.setAttribute("visibility", "visible");
          bobber.setAttribute("transform", "translate(" + bx.toFixed(1) + " " + by.toFixed(1) + ")");
        }
        drawRod(0.25 * (1 - p), [bx, by], fs.reelAngle);
        if (p >= 1) {
          fs.phase = "wait";
          SFX.plop();
          if (ripple) ripple.setAttribute("visibility", "visible");
          setStageText("アタリを待て…");
        }
      } else if (fs.phase === "wait" || fs.phase === "bite") {
        fs.idleT += dt;
        var bobDip = fs.phase === "bite" ? 7 + Math.sin(fs.idleT * 30) * 3 : Math.sin(fs.idleT * 2.4) * 2.2;
        if (bobber) {
          bobber.setAttribute("visibility", "visible");
          bobber.setAttribute("transform", "translate(180 " + (288 + bobDip).toFixed(1) + ")");
        }
        drawRod(fs.phase === "bite" ? 0.18 : 0.05 + Math.sin(fs.idleT * 1.2) * 0.02, [180, 288 + bobDip], fs.reelAngle);
      } else if (fs.phase === "fight") {
        if (bobber) bobber.setAttribute("visibility", "hidden");
        if (ripple) ripple.setAttribute("visibility", "hidden");
        fightTick(now, dt);
        if (fs.phase === "fight") {
          drawRod(0.15 + fs.tension / 100 * 0.85, [fs.fpX, fs.fpY], fs.reelAngle);
        }
      } else if (fs.phase === "land" || fs.phase === "junk" || fs.phase === "done") {
        drawRod(0.06, null, fs.reelAngle);
        if (bobber) bobber.setAttribute("visibility", "hidden");
      }
    }
    fs.raf = requestAnimationFrame(tick);
  }

  function stopStageLoop() {
    if (fs.raf) { cancelAnimationFrame(fs.raf); fs.raf = null; }
  }

  function resetFishStage() {
    clearFishingTimers();
    stopStageLoop();
    state.biteActive = false;
    fs.phase = "idle";

  function clearFishingTimers() {

    if (state.biteTimeoutTimer) { clearTimeout(state.biteTimeoutTimer); state.biteTimeoutTimer = null; }
  }

  function onStagePress(e) {

  // ===== 抽選ロジック（SPEC §5、v2ではアタリ発生時に実行） =====
  function drawFish(locationId, lureId, bouzuRate) {
    // 1. ボウズ判定（通常15% / マズメ時8%）
    if (Math.random() < (bouzuRate != null ? bouzuRate : 0.15)) {
      return null;
    }
    var loc = getLocation(locationId);
    var multipliers = LURE_MULTIPLIERS[lureId] || {};
    var pool = loc.fish;
    var weighted = [];
    var total = 0;
    Object.keys(pool).forEach(function (fid) {
      var base = pool[fid];
      var mult = multipliers[fid] !== undefined ? multipliers[fid] : 1.0;
      var w = base * mult;
      if (w > 0) {
        total += w;
        weighted.push({ id: fid, w: w });
      }
    });
    if (total <= 0 || weighted.length === 0) return null;
    var r = Math.random() * total;
    var acc = 0;
    for (var i = 0; i < weighted.length; i++) {
      acc += weighted[i].w;
      if (r < acc) return weighted[i].id;
    }
    return weighted[weighted.length - 1].id;
  }

  function handleHitSuccess(fishId) {
    if (!fishId) {
      handleBouzu();
      return;

    state.lastResultKind = "catch";

  // ===== 図鑑画面 =====
  function renderZukan() {
    var fishIds = Object.keys(FISH);
    var caughtCount = fishIds.filter(function (id) { return !!zukan[id]; }).length;
    document.getElementById("zukanCount").textContent = caughtCount + " / " + fishIds.length;

    var rarityOrder = ["common", "uncommon", "rare", "legend"];
    var rarityTotals = { common: 0, uncommon: 0, rare: 0, legend: 0 };
    var rarityCaught = { common: 0, uncommon: 0, rare: 0, legend: 0 };
    fishIds.forEach(function (id) {
      var r = FISH[id].rarity;
      rarityTotals[r]++;
      if (zukan[id]) rarityCaught[r]++;
    });
    var breakdown = document.getElementById("rarityBreakdown");
    breakdown.innerHTML = rarityOrder.map(function (r) {
      return '<span><span class="rb-dot" style="background:var(--' + r + ')"></span>' +
        RARITY_LABEL[r] + " " + rarityCaught[r] + "/" + rarityTotals[r] + "</span>";
    }).join("");

    var grid = document.getElementById("zukanGrid");
    grid.innerHTML = "";
    fishIds.forEach(function (id) {
      var fish = FISH[id];
      var caught = !!zukan[id];
      var item = document.createElement("div");
      item.className = "zukan-item " + fish.rarity + (caught ? "" : " locked");
      if (caught) {
        item.innerHTML =
          '<div class="zi-art">' + renderFish(id, { uid: "z" + id }) + '</div>' +
          '<div class="zi-name">' + fish.name + '</div>' +

        item.innerHTML =

          '<div class="zi-name">？？？</div>' +
          '<div class="zi-rarity">未捕獲</div>';

      grid.appendChild(item);

  // デバッグ用（動作検証のみに使用。ゲーム挙動には影響しない）
  window.__debugState = function () {
    return {
      pendingFishId: state.pendingFishId,
      lastCaughtFishId: state.lastCaughtFishId,
      lastResultKind: state.lastResultKind,
      phase: fs.phase,
      tension: fs.tension,
      progress: fs.progress,
      mapZoom: { s: mapZoom.s, tx: mapZoom.tx, ty: mapZoom.ty }
    };
  };
})();
</script>
